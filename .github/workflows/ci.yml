name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 필요할 때 GitHub Actions 화면에서도 직접 실행할 수 있다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 브랜치의 이전 실행은 취소해 오래된 커밋에 CI 자원을 쓰지 않는다.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 현재 파일뿐 아니라 과거 커밋에 들어갔다 삭제된 비밀정보까지 검사한다.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 빌드와 독립적인 빠른 검사를 한 작업에서 먼저 수행한다.
  quality:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Check types
        run: npm run check

      - name: Check dependencies
        run: npm run deps:check

      - name: Lint
        run: npm run lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # E2E와 Lighthouse가 동일한 프로덕션 빌드를 재사용한다.
          NEXT_DIST_DIR: .next-playwright-v7
          NEXT_PUBLIC_USE_MOCK: "1"
          # 프로덕션 + mock 조합은 next.config.ts 가 막는다. 재현 가능한 화면이 필요한 이 빌드만
          # 서버 전용 탈출구를 켠다 — NEXT_PUBLIC_ 이 아니라 브라우저 번들에는 들어가지 않는다.
          APERTURE_E2E_ALLOW_PRODUCTION_MOCK: "1"
          # NEXT_PUBLIC 값은 빌드 시 고정된다. 일반 E2E는 저장된 거부 상태로 배너를
          # 숨기고, 분석 동의 전용 스펙만 저장값을 제거해 이 테스트 ID를 사용한다.
          NEXT_PUBLIC_GA_ID: G-E2ETEST
          NEXT_PUBLIC_FORCE_ANALYTICS_CONSENT_BANNER: "0"
          # Firebase 공개 설정은 넣지 않는다. lib/firebase/client 가 Auth·Firestore·Storage 를
          # 호출 시점에 만들어, 사전 렌더링이 Client Component 를 평가해도 설정을 요구하지 않는다.
          # 이 잡이 더미 키 없이 통과하는 것이 그 지연이 살아 있다는 증거다.

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: .next-playwright-v7
          include-hidden-files: true
          # 같은 CI 실행의 후속 작업에서만 쓰는 임시 산출물이다.
          retention-days: 1

  # 실제 Firebase 프로젝트 대신 로컬 에뮬레이터로 보안 규칙을 검증한다.
  rules:
    name: Firebase security rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore and Storage Rules tests
        run: npm run test:rules

  e2e:
    name: Production E2E
    # build 작업에서 만든 산출물을 내려받아 다시 빌드하지 않는다.
    needs: build
    # Playwright 픽셀 스냅샷은 OS에 따라 달라진다. 커밋된 기준 이미지를 검토하고
    # 갱신할 때 사용하는 Windows 환경과 실행 환경을 동일하게 유지한다.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .next-playwright-v7

      - name: Run production E2E
        run: npm run test:e2e
        env:
          CI: "1"
          E2E_PRODUCTION: "1"
          NEXT_DIST_DIR: .next-playwright-v7
          NEXT_PUBLIC_USE_MOCK: "1"

      - name: Upload Playwright reports
        # 테스트 실패 시에도 디버깅에 필요한 리포트를 보존한다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # 관리자 화면은 위 프로덕션 잡에서 돌 수 없다. AuthGuard 를 여는
  # NEXT_PUBLIC_ADMIN_TEST_SESSION 은 번들에 박히는 빌드 시점 값인데
  # lib/auth/test-admin-session.ts 가 프로덕션 빌드에서 그 값을 금지한다 — 인증 우회가
  # 배포에 섞이지 않게 하려고 둔 가드다. 그래서 dev 서버로 이 디렉터리만 따로 돌린다.
  admin-e2e:
    name: Admin E2E
    # 픽셀 비교가 없는 스펙이라 기준 이미지 OS 를 맞출 필요가 없다.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run admin E2E on the dev server
        # --production 을 주지 않는다. e2e/run.cjs 가 dev 서버를 띄우고
        # NEXT_PUBLIC_ADMIN_TEST_SESSION=1 을 켠다.
        run: node e2e/run.cjs e2e/admin
        env:
          CI: "1"

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-admin
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse
    # E2E와 같은 프로덕션 빌드를 대상으로 성능을 측정한다.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Export Chromium path
        # Lighthouse가 Playwright에서 설치한 Chromium을 사용하도록 경로를 공유한다.
        run: echo "CHROME_PATH=$(node -e 'process.stdout.write(require(\"playwright\").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .next-playwright-v7

      - name: Run Lighthouse
        run: npm run test:lighthouse
        env:
          NEXT_DIST_DIR: .next-playwright-v7
          NEXT_PUBLIC_USE_MOCK: "1"
          # next start 도 next.config.ts 를 읽으므로 서버 실행에도 탈출구가 필요하다.
          APERTURE_E2E_ALLOW_PRODUCTION_MOCK: "1"

      - name: Upload Lighthouse reports
        # 기준 미달로 실패하더라도 분석할 수 있도록 결과를 업로드한다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-report
          if-no-files-found: ignore
          retention-days: 7

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: storybook-static
          retention-days: 7
