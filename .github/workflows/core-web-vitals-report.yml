name: Core Web Vitals report

on:
  schedule:
    - cron: "17 1 * * 2,5"
  workflow_dispatch:
    inputs:
      send_baseline:
        description: Send a Discord card even when every target is healthy
        required: false
        type: boolean
        default: false
      force_ai_analysis:
        description: Re-run AI analysis for current Lighthouse and field alerts
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: core-web-vitals-report
  # 직전 실행의 snapshot을 비교 기준으로 쓰므로 두 실행을 겹치거나 취소하지 않는다.
  cancel-in-progress: false

jobs:
  collect-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 같은 runner IP의 연속 요청이 Vercel system DDoS mitigation을 다시 자극하지 않게 한다.
      max-parallel: 1
      matrix:
        shard: [0, 1, 2]
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      LIGHTHOUSE_SHARD_INDEX: ${{ matrix.shard }}
      LIGHTHOUSE_SHARD_COUNT: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Locate Chromium
        shell: bash
        run: |
          chromium_path="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          echo "CHROME_PATH=$chromium_path" >> "$GITHUB_ENV"

      - name: Run production Lighthouse
        id: lighthouse
        continue-on-error: true
        run: npm run test:lighthouse:production

      - name: Upload Lighthouse shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-web-vitals-lighthouse-shard-${{ matrix.shard }}
          path: lighthouse-production-report/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 90

  report:
    needs: collect-lighthouse
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
      DISCORD_PERFORMANCE_WEBHOOK_URL: ${{ secrets.DISCORD_PERFORMANCE_WEBHOOK_URL }}
      PERFORMANCE_TRIAGE_PROVIDER: ${{ vars.PERFORMANCE_TRIAGE_PROVIDER }}
      PERFORMANCE_TRIAGE_PROVIDER_MODEL: ${{ vars.PERFORMANCE_TRIAGE_PROVIDER_MODEL }}
      PERFORMANCE_TRIAGE_PROVIDER_API_KEY: ${{ secrets.PERFORMANCE_TRIAGE_PROVIDER_API_KEY }}
      PERFORMANCE_TRIAGE_FALLBACK_PROVIDER: ${{ vars.PERFORMANCE_TRIAGE_FALLBACK_PROVIDER }}
      PERFORMANCE_TRIAGE_FALLBACK_PROVIDER_MODEL: ${{ vars.PERFORMANCE_TRIAGE_FALLBACK_PROVIDER_MODEL }}
      PERFORMANCE_TRIAGE_FALLBACK_PROVIDER_API_KEY: ${{ secrets.PERFORMANCE_TRIAGE_FALLBACK_PROVIDER_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      SEND_BASELINE: ${{ inputs.send_baseline == true && 'true' || 'false' }}
      FORCE_AI_ANALYSIS: ${{ inputs.force_ai_analysis == true && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download Lighthouse shards
        uses: actions/download-artifact@v4
        with:
          pattern: core-web-vitals-lighthouse-shard-*
          path: lighthouse-production-report

      - name: Merge Lighthouse shards
        id: lighthouse
        continue-on-error: true
        run: npm run test:lighthouse:merge

      # 실패한 측정도 원인을 조사할 수 있어야 하므로 snapshot과 독립적으로 보존한다.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-web-vitals-lighthouse
          path: lighthouse-production-report/
          if-no-files-found: error
          retention-days: 90

      - name: Build performance report
        id: performance-report
        if: steps.lighthouse.outcome == 'success'
        run: npm run performance:report

      - name: Upload performance snapshot
        if: steps.performance-report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: core-web-vitals-snapshot
          path: performance-snapshot.json
          if-no-files-found: error
          retention-days: 90

      # Discord 전송이 실패한 실행에서도 AI 분석을 확인할 수 있어야 한다.
      # 분석이 없는 실행에서는 파일 자체가 없으므로 누락을 실패로 보지 않는다.
      - name: Upload AI analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-web-vitals-ai-report
          path: performance-ai-report.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Fail when Lighthouse failed
        if: steps.lighthouse.outcome != 'success'
        run: exit 1
