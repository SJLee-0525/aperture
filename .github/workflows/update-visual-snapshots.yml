name: Update visual snapshots

on:
  # 기준 이미지 변경은 검토가 필요하므로 수동으로만 실행한다.
  workflow_dispatch:

# 선택한 브랜치에 결과를 커밋하고 CI를 다시 실행하는 데 필요한 최소 권한이다.
permissions:
  actions: write
  contents: write

concurrency:
  # 실행 도중 취소하면 기준 이미지 일부만 생성될 수 있어 같은 브랜치에서도 중단하지 않는다.
  group: visual-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate Windows baselines
    runs-on: windows-latest
    timeout-minutes: 20
    # 외부 데이터 변화 없이 재현 가능한 화면을 만들기 위해 mock 콘텐츠를 사용한다.
    env:
      NEXT_PUBLIC_USE_MOCK: "1"
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-mock-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-mock.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-mock
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-mock.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          # 결과를 사용자가 선택한 브랜치에 다시 커밋하기 위한 설정이다.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Regenerate visual snapshots
        run: npm run test:visual:update

      - name: Upload snapshots for review
        # 커밋 여부와 별개로 생성 결과를 내려받아 검토할 수 있게 보존한다.
        uses: actions/upload-artifact@v4
        with:
          name: windows-visual-snapshots-${{ github.run_id }}
          path: e2e/visual/public-pages.visual.e2e.ts-snapshots
          if-no-files-found: error
          retention-days: 7

      - name: Commit updated snapshots
        # 변경이 있을 때만 커밋하고, 새 기준 이미지로 전체 CI를 다시 검증한다.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- e2e/visual/public-pages.visual.e2e.ts-snapshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "No visual snapshot changes were generated." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[TEST] Windows 시각 기준선 갱신"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          gh workflow run ci.yml --ref "$env:GITHUB_REF_NAME"
          "Updated Windows visual snapshots on ``$env:GITHUB_REF_NAME``." >> $env:GITHUB_STEP_SUMMARY
