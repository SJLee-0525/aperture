name: Weekly dependency security report

on:
  schedule:
    - cron: "7 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  vulnerability-alerts: read

concurrency:
  group: dependency-security-report
  cancel-in-progress: false

jobs:
  report:
    name: Send dependency security report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and send report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_SECURITY_WEBHOOK_URL: ${{ secrets.DISCORD_SECURITY_WEBHOOK_URL }}
        run: npm run security:report
