version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Seoul"
    # 일반 버전 PR은 만들지 않고 security update PR만 허용한다.
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: "Asia/Seoul"
    # 일반 버전 PR은 만들지 않고 security update PR만 허용한다.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
