<!doctype html>
<html lang="ko" data-theme="light" data-section="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sungjoon Lee — Mobile</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/site.css">
<link rel="stylesheet" href="styles/music.css">
<link rel="stylesheet" href="styles/dev.css">
<link rel="stylesheet" href="styles/mobile.css?v=8">
<link rel="stylesheet" href="styles/mobile-site.css?v=11">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #b9b9be; overflow: hidden; display: grid; place-items: center; font-family: var(--font-sans); }
  .phone-stage { transform-origin: center; }
  .m-tile, .m-alb, .m-tab, .m-filtbtn, .m-gbtn, .m-expitem, .chip-tag, .ml-btn, .di { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div class="phone-stage">
  <div class="phone">
    <header class="m-appbar">
      <button class="wm" data-go="home">Sungjoon Lee<span class="dot">.</span></button>
      <span class="sp"></span>
      <button class="ab-btn" data-act="theme" title="테마"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
      <button class="ab-btn" id="mburger" title="메뉴"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </header>

    <div id="mscreen"></div>
    <div class="m-navbar" id="mnav"></div>
    <div id="mov" hidden></div>

    <div id="mmenu">
      <div class="sc" data-menuclose></div>
      <div class="pnl">
        <div class="mh"><button class="x" data-menuclose>✕</button></div>
        <label class="msearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="mSearch" type="text" placeholder="검색 · 태그 / 장비 / 장소"></label>
        <div class="mgroup" data-group="photo">
          <button class="di" data-toggle="photo"><span class="t">사진</span><span class="ex">+</span></button>
          <div class="subs">
            <button data-go="photo" data-sub="work">작업</button>
            <button data-go="photo" data-sub="albums">앨범</button>
            <button data-go="photo" data-sub="map">지도</button>
            <button data-go="photo" data-sub="about">소개</button>
          </div>
        </div>
        <div class="mgroup" data-group="music">
          <button class="di" data-toggle="music"><span class="t">음악</span><span class="ex">+</span></button>
          <div class="subs">
            <button data-go="music" data-sub="works">연주 목록</button>
            <button data-go="music" data-sub="schedule">공연 일정</button>
            <button data-go="music" data-sub="awards">수상</button>
            <button data-go="music" data-sub="media">영상</button>
            <button data-go="music" data-sub="contact">연락처</button>
          </div>
        </div>
        <div class="mgroup" data-group="dev">
          <button class="di" data-toggle="dev"><span class="t">개발</span><span class="ex">+</span></button>
          <div class="subs">
            <button data-go="dev" data-sub="about">소개</button>
            <button data-go="dev" data-sub="stack">기술 스택</button>
            <button data-go="dev" data-sub="projects">프로젝트</button>
            <button data-go="dev" data-sub="career">경력</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="portfolio.js"></script>
<script src="mobile-screens.js?v=8"></script>
<script src="music.js"></script>
<script src="dev.js"></script>
<script>
  const screen = document.getElementById('mscreen');
  const ov = document.getElementById('mov');
  const nav = document.getElementById('mnav');
  const menu = document.getElementById('mmenu');
  const phone = document.querySelector('.phone');
  const html = document.documentElement;

  let disc = 'home', curTab = 'work', detailIdx = 0, detailState = 'peek', musicRoot = null, devRoot = null;
  const PHOTO_VIEWS = { work: mHome, albums: mAlbums, map: mMap, about: mAbout };

  const IC = {
    grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    album:'<rect x="3" y="5" width="18" height="14"/><path d="M3 9h18"/>',
    map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    music:'<path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>',
    cal:'<rect x="3" y="4" width="18" height="17"/><path d="M3 9h18M8 2v4M16 2v4"/>',
    play:'<path d="M6 4l14 8-14 8z"/>',
    mail:'<rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/>',
    code:'<path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/>',
    folder:'<path d="M3 7h6l2 2h10v10H3z"/>',
  };
  const ic = n => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7">${IC[n]||''}</svg>`;
  const NAV = {
    home:  [],
    photo: [['work','작업','grid'],['albums','앨범','album'],['map','지도','map'],['about','소개','user']],
    music: [['works','연주','music'],['schedule','일정','cal'],['media','영상','play'],['contact','연락','mail']],
    dev:   [['about','소개','user'],['stack','기술','code'],['projects','프로젝트','folder'],['career','경력','cal']],
  };
  function renderNav(active){
    const items = NAV[disc] || [];
    if(!items.length){ nav.innerHTML = ''; return; }
    nav.innerHTML = `<div class="m-tabbar">${items.map(([id,label,icon])=>`<div class="m-tab ${id===active?'on':''}" data-nav="${id}">${ic(icon)}<span>${label}</span></div>`).join('')}</div>`;
  }

  function landingHTML(){
    return `<section class="ml" style="padding-top:40px">
      <div class="ml-eyebrow">Photographer · Pianist · Developer</div>
      <h1 class="ml-name">Sungjoon Lee<span class="dot">.</span></h1>
      <p class="ml-sub">사진, 피아노, 그리고 코드 — 세 개의 언어로 같은 이야기를 합니다. 빛과 정적, 구조와 노래, 흐름과 인터랙션.</p>
      <div class="ml-btns">
        <a class="ml-btn" data-go="photo"><span class="t">사진</span><span class="a">↗</span></a>
        <a class="ml-btn" data-go="music"><span class="t">음악</span><span class="a">↗</span></a>
        <a class="ml-btn" data-go="dev"><span class="t">개발</span><span class="a">↗</span></a>
      </div>
    </section>`;
  }

  function setAccent(name){ html.setAttribute('data-section', name==='home'?'home':name); }

  function go(name, sub){
    disc = name; setAccent(name); closeOv(); closeMenu();
    if(name === 'home'){ screen.classList.add('no-nav'); screen.innerHTML = landingHTML(); renderNav(null); }
    else if(name === 'photo'){ screen.classList.remove('no-nav'); const v = PHOTO_VIEWS[sub] ? sub : 'work'; curTab = v; screen.innerHTML = PHOTO_VIEWS[v](); if(v==='work') decoratePhoto(); renderNav(v); }
    else if(name === 'music'){ screen.classList.remove('no-nav'); screen.innerHTML = '<div id="music-root"></div>'; musicRoot = document.getElementById('music-root'); musicRoot.innerHTML = window.Music.render(); window.Music.init(musicRoot); window.Music.startType(musicRoot); renderNav(sub||null); if(sub) requestAnimationFrame(()=>window.Music.nav(sub, musicRoot)); }
    else if(name === 'dev'){ screen.classList.remove('no-nav'); screen.innerHTML = '<div id="dev-root"></div>'; devRoot = document.getElementById('dev-root'); devRoot.innerHTML = window.Dev.render(); window.Dev.init(devRoot); window.Dev.activate(devRoot); renderNav(sub||null); if(sub) requestAnimationFrame(()=>window.Dev.nav(sub, devRoot)); }
    if(!(name!=='home' && sub)) screen.scrollTop = 0;
  }

  function openDetail(i){ detailIdx = i; detailState = 'peek'; ov.innerHTML = mDetailPeek(i); ov.hidden = false; }  function toggleSheet(){ detailState = detailState==='peek'?'sheet':'peek'; ov.innerHTML = detailState==='peek'?mDetailPeek(detailIdx):mDetailSheet(detailIdx); }
  // photo: move pill tags into a row with a pinned filter button
  function decoratePhoto(){
    const chips = screen.querySelector('.m-chips'); if(!chips || chips.closest('.m-chiprow')) return;
    const row = document.createElement('div'); row.className = 'm-chiprow';
    chips.parentNode.insertBefore(row, chips); row.appendChild(chips);
    const fb = document.createElement('button'); fb.className = 'm-filtbtn2'; fb.dataset.filt = '1';
    fb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>';
    row.appendChild(fb);
  }

  function openAlbum(i){ closeOv(); screen.innerHTML = mAlbumDetail(i); renderNav('albums'); }
  function openOv(h){ ov.innerHTML = h; ov.hidden = false; }
  function closeOv(){ ov.hidden = true; ov.innerHTML = ''; }
  function closeMenu(){ menu.classList.remove('open'); document.getElementById('mburger').innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>'; }

  const burger = document.getElementById('mburger');
  const I_MENU = '<svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>';
  const I_X = '<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>';
  function toggleMenu(){ const open = !menu.classList.contains('open'); menu.classList.toggle('open', open); burger.innerHTML = open ? I_X : I_MENU; }
  burger.addEventListener('click', toggleMenu);
  // menu discipline accordion
  menu.addEventListener('click', e=>{
    const tg = e.target.closest('[data-toggle]'); if(!tg) return;
    const g = tg.closest('.mgroup'); const wasOpen = g.classList.contains('open');
    menu.querySelectorAll('.mgroup').forEach(x=>x.classList.remove('open'));
    if(!wasOpen) g.classList.add('open');
  });

  // menu search → filter photo grid
  document.getElementById('mSearch').addEventListener('input', e=>{
    const q = e.target.value;
    if(disc !== 'photo' || curTab !== 'work'){ go('photo'); }
    const grid = screen.querySelector('.m-grid'); if(!grid) return;
    const idxs = filteredIndexes('전체', q, '전체', 16, 300);
    grid.innerHTML = idxs.length ? idxs.map(i=>mTile(i)).join('') : '<div style="padding:60px 0;text-align:center;color:var(--text-3);font-size:13px">검색 결과 없음</div>';
  });

  // bottom nav
  nav.addEventListener('click', e=>{
    const t = e.target.closest('[data-nav]'); if(!t) return;
    const id = t.dataset.nav;
    if(disc === 'home'){ go(id); return; }
    if(disc === 'photo'){ curTab = id; closeOv(); screen.innerHTML = PHOTO_VIEWS[id](); renderNav(id); screen.scrollTop = 0; return; }
    if(disc === 'music'){ window.Music.nav(id, musicRoot); nav.querySelectorAll('.m-tab').forEach(x=>x.classList.toggle('on', x.dataset.nav===id)); return; }
    if(disc === 'dev'){ window.Dev.nav(id, devRoot); nav.querySelectorAll('.m-tab').forEach(x=>x.classList.toggle('on', x.dataset.nav===id)); return; }
  });

  phone.addEventListener('click', e => {
    const goEl = e.target.closest('[data-go]');
    if (goEl) { go(goEl.dataset.go, goEl.dataset.sub); return; }
    if (e.target.closest('[data-menuclose]')) { closeMenu(); return; }
    if (e.target.closest('[data-act="theme"]')) { const t = html.getAttribute('data-theme')==='dark'?'light':'dark'; html.setAttribute('data-theme',t); return; }

    // photo overlay + body interactions
    if (!ov.hidden) {
      if (e.target.closest('.m-back')) { closeOv(); return; }
      if (e.target.closest('.m-export')) { openOv(mExportSheet(detailIdx)); return; }
      if (e.target.closest('.m-close')) { if (ov.querySelector('.m-exprow')) openDetail(detailIdx); else closeOv(); return; }
      if (ov.querySelector('.m-exprow')) {
        const it = e.target.closest('.m-expitem'); if (it){ ov.querySelectorAll('.m-expitem').forEach(x=>x.classList.remove('on')); it.classList.add('on'); return; }
        const seg = e.target.closest('.m-opt-seg button'); if (seg){ seg.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); seg.classList.add('on'); return; }
      }
      if (ov.querySelector('.m-fsheet')) {
        if (e.target.closest('.btn-primary')) { closeOv(); return; }
        const chip = e.target.closest('.chip-tag'); if (chip){ ov.querySelectorAll('.m-fsheet .chip-tag').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); return; }
      }
      if (ov.querySelector('.m-detail')) {
        const sh = e.target.closest('.m-sheet');
        if (sh && !e.target.closest('button') && !e.target.closest('.m-iconbtn')) { toggleSheet(); return; }
      }
      return;
    }
    if (disc === 'photo') {
      const tile = e.target.closest('.m-tile[data-i]'); if (tile) { openDetail(+tile.dataset.i); return; }
      const alb = e.target.closest('.m-alb[data-album]'); if (alb) { openAlbum(+alb.dataset.album); return; }
      if (e.target.closest('[data-filt]')) { openOv(mFilterSheet()); return; }
      if (e.target.closest('.m-back')) { curTab='albums'; screen.innerHTML = PHOTO_VIEWS.albums(); renderNav('albums'); return; }
      const chip = e.target.closest('.m-chips .chip-tag'); if (chip){ screen.querySelectorAll('.m-chips .chip-tag').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); return; }
    }
  });

  function fit(){ const s = Math.min((innerWidth-24)/390, (innerHeight-24)/844, 1.15); document.querySelector('.phone-stage').style.transform = 'scale('+s+')'; }
  addEventListener('resize', fit); fit();

  go('home');
</script>
</body>
</html>
